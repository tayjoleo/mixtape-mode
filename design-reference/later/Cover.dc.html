<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>J-card cover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@600&family=Gochi+Hand&family=Permanent+Marker&family=Rock+Salt&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 195px; height: 305px; position: relative; box-sizing: border-box; border: 4px solid #111111; border-radius: 4px; overflow: hidden; isolation: isolate; font-family: 'Space Grotesk', sans-serif; color: #111111; background: #FFFDF5">

  <sc-if value="{{isRiso}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #F3ECDD"></div>
    <div aria-hidden="true" style="position: absolute; left: 50px; top: 110px; width: 190px; height: 190px; border-radius: 50%; background-image: radial-gradient({{b}} 2.6px, transparent 3px); background-size: 9px 9px; mix-blend-mode: multiply"></div>
    <div aria-hidden="true" style="position: absolute; left: 80px; top: 160px; width: 110px; height: 110px; border-radius: 50%; background: {{a}}; mix-blend-mode: multiply"></div>
    <span style="position: absolute; left: 14px; top: 14px; right: 14px; font-family: 'Bungee', sans-serif; font-size: 28px; line-height: 0.95; color: {{b}}; text-shadow: 3px 3px 0 {{a}}">{{title}}</span>
  </sc-if>

  <sc-if value="{{isNotebook}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #FFFDF5; background-image: repeating-linear-gradient(180deg, transparent 0px, transparent 21px, #A9D3EE 21px, #A9D3EE 22px)"></div>
    <div aria-hidden="true" style="position: absolute; left: 22px; top: 0; bottom: 0; width: 2px; background: {{a}}"></div>
    <span style="position: absolute; left: 32px; top: 18px; right: 10px; font-family: 'Permanent Marker', cursive; font-size: 26px; line-height: 1.1; color: {{b}}; transform: rotate(-3deg)">{{title}}</span>
    <span style="position: absolute; left: 32px; bottom: 16px; font-family: 'Caveat', cursive; font-size: 26px; color: {{a}}">xo</span>
  </sc-if>

  <sc-if value="{{isZine}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #F7F7F2; background-image: radial-gradient(rgba(17,17,17,0.35) 1.6px, transparent 2px); background-size: 7px 7px"></div>
    <div aria-hidden="true" style="position: absolute; left: -20px; top: 140px; width: 240px; height: 90px; background: #111111; transform: rotate(-8deg)"></div>
    <span style="position: absolute; left: 12px; top: 16px; max-width: 160px; background: #111111; color: #F7F7F2; font-family: 'Bungee', sans-serif; font-size: 20px; line-height: 1.05; padding: 4px 8px; transform: rotate(-4deg)">{{title}}</span>
    <span style="position: absolute; right: 12px; bottom: 18px; background: #F7F7F2; border: 2px solid #111111; font-family: 'Rock Salt', cursive; font-size: 13px; padding: 2px 6px; transform: rotate(4deg)">side a</span>
  </sc-if>

  <sc-if value="{{isStripe}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #FFFDF5"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 96px; height: 66px; background: linear-gradient(180deg, #E63946 0 25%, #FF8A3D 25% 50%, #FFD23F 50% 75%, #2EC4F1 75% 100%); border-top: 3px solid #111111; border-bottom: 3px solid #111111"></div>
    <span style="position: absolute; left: 12px; top: 12px; font-family: 'Bungee', sans-serif; font-size: 34px; line-height: 1">C-90</span>
    <span style="position: absolute; left: 12px; bottom: 14px; right: 12px; font-family: 'Gochi Hand', cursive; font-size: 24px; line-height: 1.05">{{title}}</span>
  </sc-if>

  <sc-if value="{{isChecker}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #FFFDF5; background-image: repeating-conic-gradient({{a}} 0% 25%, #FFFDF5 0% 50%); background-size: 32px 32px"></div>
    <span style="position: absolute; left: 14px; right: 14px; top: 116px; background: #FFFDF5; border: 3px solid #111111; font-family: 'Bungee', sans-serif; font-size: 22px; line-height: 1.05; text-align: center; padding: 10px 6px; transform: rotate(-3deg)">{{title}}</span>
  </sc-if>

  <sc-if value="{{isPolaroid}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: {{b}}"></div>
    <div style="position: absolute; left: 22px; top: 34px; width: 143px; height: 196px; box-sizing: border-box; background: #FFFDF5; border: 3px solid #111111; padding: 10px 10px 0; transform: rotate(4deg); display: flex; flex-direction: column; gap: 8px">
      <div aria-hidden="true" style="height: 118px; border: 2px solid #111111; background-color: {{a}}; background-image: radial-gradient(rgba(255,255,255,0.5) 1.6px, transparent 2px); background-size: 8px 8px"></div>
      <span style="font-family: 'Caveat', cursive; font-size: 24px; line-height: 1; text-align: center">{{title}}</span>
    </div>
  </sc-if>

  <sc-if value="{{isStamp}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-color: #F3ECDD; background-image: radial-gradient(rgba(17,17,17,0.06) 0.8px, transparent 1px); background-size: 4px 4px"></div>
    <div style="position: absolute; left: 22px; top: 74px; width: 143px; height: 143px; box-sizing: border-box; border: 6px double {{a}}; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px; transform: rotate(-12deg)">
      <span style="font-family: 'Bungee', sans-serif; font-size: 18px; line-height: 1.05; color: {{a}}">{{title}}</span>
    </div>
    <span style="position: absolute; left: 12px; bottom: 14px; font-family: 'Bungee', sans-serif; font-size: 12px; color: {{a}}">Side A + B</span>
  </sc-if>

  <sc-if value="{{isBig}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: {{a}}"></div>
    <span aria-hidden="true" style="position: absolute; left: -8px; top: -30px; font-family: 'Bungee', sans-serif; font-size: 220px; line-height: 1; color: {{b}}">{{big}}</span>
    <span style="position: absolute; left: 12px; bottom: 14px; right: 12px; background: #FFFDF5; border: 3px solid #111111; font-family: 'Bungee', sans-serif; font-size: 16px; padding: 4px 8px">{{title}}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"riso","options":["riso","notebook","zine","stripe","checker","polaroid","stamp","big"]},"a":{"editor":"color","default":"#FF48B0"},"b":{"editor":"color","default":"#0078BF"},"coverTitle":{"editor":"text","default":"Riso Night"},"$preview":{"width":195,"height":305}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const k = p.kind ?? 'riso';
    const title = p.coverTitle ?? 'Riso Night';
    return {
      isRiso: k === 'riso', isNotebook: k === 'notebook', isZine: k === 'zine', isStripe: k === 'stripe',
      isChecker: k === 'checker', isPolaroid: k === 'polaroid', isStamp: k === 'stamp', isBig: k === 'big',
      a: p.a ?? '#FF48B0',
      b: p.b ?? '#0078BF',
      title: title,
      big: (title.replace(/[^A-Za-z0-9]/g, '').charAt(0) || 'A').toUpperCase()
    };
  }
}
</script>
</body>
</html>
